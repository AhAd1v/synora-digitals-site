<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Core Admin - Synora Digitals</title>
<!-- Internal tool, not a marketing page — kept out of search entirely, unlike
     the other 5 pages which all opt in with "index, follow". -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d9d9d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e47" media="(prefers-color-scheme: dark)">

<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preload" href="assets/fonts/Quera.otf"        as="font" type="font/otf" crossorigin="anonymous">
<link rel="preload" href="assets/fonts/Arha Regular.otf" as="font" type="font/otf" crossorigin="anonymous">
<link rel="stylesheet" href="shared.css">
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-dark','');</script>

<style>
.page-card { min-height: calc(100vh - var(--nav-h)); min-height: calc(100svh - var(--nav-h)); display: flex; align-items: center; justify-content: center; }

:root {
  --r-field: 999px;
  --fs-form-input: max(16px, calc(1.5 * var(--u)));
}

.ca-wrap {
  width: 100%; max-width: calc(46 * var(--u)); min-width: min(100%, 360px);
  margin: 0 auto;
  padding: max(24px, calc(3 * var(--u))) max(20px, calc(2 * var(--u)));
  text-align: center;
}
.ca-wrap h1 { margin-bottom: max(6px, calc(.6 * var(--u))); }
.ca-sub { color: var(--muted); font-size: var(--fs-form-input); margin: 0 0 max(28px, calc(2.6 * var(--u))); }

.ca-form { display: flex; flex-direction: column; gap: max(16px, calc(1.6 * var(--u))); text-align: left; }
.ca-field {
  -webkit-appearance: none; appearance: none;
  display: block; width: 100%; box-sizing: border-box;
  background: var(--header-bg);
  border: 1.5px solid transparent;
  border-radius: var(--r-field);
  padding: max(14px, calc(1.3 * var(--u))) max(22px, calc(2 * var(--u)));
  font-family: 'Arha', sans-serif;
  font-size: var(--fs-form-input);
  color: var(--primary);
  outline: none;
  transition: border-color .25s;
}
.ca-field:focus { border-color: var(--phrase); }
.ca-field.otp-input { letter-spacing: .5em; text-align: center; }

.ca-submit {
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  border: none; border-radius: var(--r-field);
  padding: max(14px, calc(1.3 * var(--u))) max(22px, calc(2 * var(--u)));
  font-family: 'Arha', sans-serif; font-size: var(--fs-form-input);
  background: var(--primary); color: var(--main-bg);
  transition: opacity .2s, transform .15s;
}
.ca-submit:hover { opacity: .9; }
.ca-submit:disabled { opacity: .5; cursor: default; }

.ca-error { color: #e5484d; font-size: max(13px, calc(1.2 * var(--u))); margin: 0; min-height: 1em; }
.ca-hint { color: var(--muted); font-size: max(13px, calc(1.2 * var(--u))); margin: 0; }
.ca-resend {
  background: none; border: none; cursor: pointer; padding: 0;
  color: var(--muted); text-decoration: underline; font-family: 'Arha', sans-serif;
  font-size: max(13px, calc(1.2 * var(--u)));
}
.ca-resend:disabled { cursor: default; opacity: .6; text-decoration: none; }

.ca-stage { display: none; }
.ca-stage.active { display: flex; flex-direction: column; gap: max(16px, calc(1.6 * var(--u))); }
</style>
</head>
<body>

<!-- ═══ NAV — bare minimum: logo + dark toggle only, no marketing pills ═══ -->
<nav>
  <div class="nav-left"></div>
  <a href="/" class="logo">
    <img class="logo-img" src="assets/img/logo-light.svg" alt="Synora Digitals">
  </a>
  <div class="nav-right">
    <button class="dark-btn" id="darkBtn" onclick="toggleDark()" aria-label="Toggle dark mode"><img class="theme-icon" src="assets/img/moon-icon.svg" alt=""></button>
  </div>
</nav>

<div class="page-card">
  <div class="ca-wrap">
    <h1>Core Admin</h1>
    <p class="ca-sub">Company/staff access only.</p>

    <!-- Stage 1: email + password -->
    <form class="ca-form ca-stage active" id="stageCreds" onsubmit="return handleCreds(event)">
      <input class="ca-field" type="email" id="caEmail" name="email" autocomplete="email" placeholder="Email" required aria-label="Email">
      <input class="ca-field" type="password" id="caPassword" name="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
      <p class="ca-error" id="credsError"></p>
      <button class="ca-submit" type="submit" id="credsSubmit">Continue</button>
    </form>

    <!-- Stage 2: OTP code -->
    <form class="ca-form ca-stage" id="stageOtp" onsubmit="return handleOtp(event)">
      <p class="ca-hint" id="otpHint"></p>
      <input class="ca-field otp-input" type="text" id="caOtp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456" required aria-label="Verification code">
      <p class="ca-error" id="otpError"></p>
      <button class="ca-submit" type="submit" id="otpSubmit">Verify &amp; sign in</button>
      <button class="ca-resend" type="button" id="resendBtn" onclick="backToCreds()">Enter details again to resend</button>
    </form>
  </div>
</div>

<script src="assets/js/shared.js"></script>
<script>
// API_BASE mirrors consult.html's convention (relative /api/* in production,
// same-origin via Vercel's rewrite) — see backend/README.md for local dev,
// where the static page and the FastAPI dev server run on different ports
// and you'd point this at http://127.0.0.1:8000 instead.
var API_BASE = '';

var currentEmail = '';
var cooldownTimer = null;

function showStage(id) {
  document.querySelectorAll('.ca-stage').forEach(function (el) { el.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function backToCreds() {
  clearInterval(cooldownTimer);
  document.getElementById('otpError').textContent = '';
  document.getElementById('caPassword').value = '';
  showStage('stageCreds');
}

function startCooldown(seconds) {
  var btn = document.getElementById('resendBtn');
  btn.disabled = true;
  function tick() {
    if (seconds <= 0) {
      clearInterval(cooldownTimer);
      btn.disabled = false;
      btn.textContent = 'Enter details again to resend';
      return;
    }
    btn.textContent = 'Resend available in ' + seconds + 's';
    seconds--;
  }
  clearInterval(cooldownTimer);
  tick();
  cooldownTimer = setInterval(tick, 1000);
}

async function handleCreds(e) {
  e.preventDefault();
  var email = document.getElementById('caEmail').value.trim().toLowerCase();
  var password = document.getElementById('caPassword').value;
  var errorEl = document.getElementById('credsError');
  var submitBtn = document.getElementById('credsSubmit');
  errorEl.textContent = '';
  submitBtn.disabled = true;

  try {
    await fetch(API_BASE + '/api/coreadmin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email: email, password: password }),
    });
    // Response is intentionally identical whether or not this was actually
    // valid (see routes.py) — always advance to the OTP stage.
  } catch (err) {
    errorEl.textContent = 'Network error — check your connection and try again.';
    submitBtn.disabled = false;
    return false;
  }

  currentEmail = email;
  document.getElementById('otpHint').textContent = 'If that account exists, a 6-digit code was sent to ' + email + '. It expires in 10 minutes.';
  document.getElementById('caOtp').value = '';
  document.getElementById('otpError').textContent = '';
  showStage('stageOtp');
  startCooldown(60);
  submitBtn.disabled = false;
  document.getElementById('caOtp').focus();
  return false;
}

async function handleOtp(e) {
  e.preventDefault();
  var otp = document.getElementById('caOtp').value.trim();
  var errorEl = document.getElementById('otpError');
  var submitBtn = document.getElementById('otpSubmit');
  errorEl.textContent = '';
  submitBtn.disabled = true;

  try {
    var res = await fetch(API_BASE + '/api/coreadmin/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email: currentEmail, otp: otp }),
    });
    if (!res.ok) {
      errorEl.textContent = 'Invalid or expired code. Check your email and try again.';
      submitBtn.disabled = false;
      return false;
    }
  } catch (err) {
    errorEl.textContent = 'Network error — check your connection and try again.';
    submitBtn.disabled = false;
    return false;
  }

  // Session cookie is set — the dashboard itself is a separate page (not built
  // yet) that calls GET /api/coreadmin/me to confirm the session before
  // rendering anything. For now, land back on the homepage.
  window.location.href = '/';
  return false;
}
</script>
</body>
</html>
